services:
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: k6-agentic-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '9090:9090'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.1
    container_name: k6-agentic-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '3000:3000'
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    container_name: k6-agentic-postgres
    environment:
      POSTGRES_USER: k6
      POSTGRES_PASSWORD: k6
      POSTGRES_DB: k6_perf
    volumes:
      # Scripts here run once, in filename order, only on first init of an
      # empty data directory -- see the "Initialization scripts" section of
      # the postgres image docs. Delete the postgres-data volume to reseed.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U k6 -d k6_perf']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  postgres-data:
