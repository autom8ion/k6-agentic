name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  smoke-tests:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      # Two separate action invocations (rather than one `path` list) so each
      # protocol gets its own --summary-export file instead of overwriting a
      # shared one.
      - uses: grafana/run-k6-action@v1
        with:
          path: tests/rest/smoke.ts
          fail-fast: true
          flags: --summary-export=reports/k6-rest-summary.json
      - uses: grafana/run-k6-action@v1
        with:
          path: tests/graphql/smoke.ts
          fail-fast: true
          flags: --summary-export=reports/k6-graphql-summary.json
      # Consumed by the KPI-Dashboard qa_collector (per-check pass/fail, thresholds).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-summary
          path: reports/k6-*-summary.json
          retention-days: 14

  db-smoke-test:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: k6
          POSTGRES_PASSWORD: k6
          POSTGRES_DB: k6_perf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U k6 -d k6_perf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Seed database
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          for f in docker/postgres/init/*.sql; do
            PGPASSWORD=k6 psql -h localhost -U k6 -d k6_perf -f "$f"
          done

      - uses: grafana/setup-k6-action@v1

      # k6/x/sql is a Go extension, but k6 v1.2.0+ auto-provisions it (and its
      # Postgres driver) on first run -- no xk6/Go build step needed here. See
      # README.md "Database performance testing".
      - name: Run DB smoke test
        env:
          POSTGRES_URL: postgres://k6:k6@localhost:5432/k6_perf?sslmode=disable
        run: k6 run --summary-export=reports/k6-db-summary.json tests/db/smoke.ts

      # Consumed by the KPI-Dashboard qa_collector (per-check pass/fail, thresholds).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-db-summary
          path: reports/k6-db-summary.json
          retention-days: 14
