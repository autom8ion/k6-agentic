name: Performance Dashboard

# Runs the three smoke suites (the only test type this framework allows
# unattended in CI -- see "Known constraints" in CLAUDE.md) with k6's
# built-in web dashboard enabled, then publishes the exported HTML
# dashboards + summary JSON to GitHub Pages (gh-pages branch), building up
# a run-history manifest (data/runs.json) that a Grafana JSON API /
# Infinity datasource can chart trends from. See README.md "Publishing
# dashboards to GitHub Pages".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rest-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Run REST smoke test with web dashboard export
        env:
          K6_WEB_DASHBOARD: 'true'
          K6_WEB_DASHBOARD_EXPORT: dashboard-artifacts/rest-dashboard.html
        run: |
          mkdir -p dashboard-artifacts
          k6 run --summary-export=dashboard-artifacts/rest-summary.json tests/rest/smoke.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-rest
          path: dashboard-artifacts/rest-*
          retention-days: 1

  graphql-smoke:
    runs-on: ubuntu-latest
    # countries.trevorblades.com rate-limits at ~50-60 req/min; this smoke
    # test is already tuned to stay well under that (1 VU, 20s, sleep(2)).
    # Never widen this scenario for the dashboard job -- see CLAUDE.md.
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Run GraphQL smoke test with web dashboard export
        env:
          K6_WEB_DASHBOARD: 'true'
          K6_WEB_DASHBOARD_EXPORT: dashboard-artifacts/graphql-dashboard.html
        run: |
          mkdir -p dashboard-artifacts
          k6 run --summary-export=dashboard-artifacts/graphql-summary.json tests/graphql/smoke.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-graphql
          path: dashboard-artifacts/graphql-*
          retention-days: 1

  db-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: k6
          POSTGRES_PASSWORD: k6
          POSTGRES_DB: k6_perf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U k6 -d k6_perf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Seed database
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          for f in docker/postgres/init/*.sql; do
            PGPASSWORD=k6 psql -h localhost -U k6 -d k6_perf -f "$f"
          done

      - uses: grafana/setup-k6-action@v1

      - name: Run DB smoke test with web dashboard export
        env:
          POSTGRES_URL: postgres://k6:k6@localhost:5432/k6_perf?sslmode=disable
          K6_WEB_DASHBOARD: 'true'
          K6_WEB_DASHBOARD_EXPORT: dashboard-artifacts/db-dashboard.html
        run: |
          mkdir -p dashboard-artifacts
          k6 run --summary-export=dashboard-artifacts/db-summary.json tests/db/smoke.ts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-db
          path: dashboard-artifacts/db-*
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs: [rest-smoke, graphql-smoke, db-smoke]
    # Publish whatever succeeded even if one protocol's smoke test failed
    # (e.g. a transient GraphQL 429) -- a partial dashboard beats none.
    if: always() && contains(needs.*.result, 'success')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          pattern: dashboard-*
          path: dashboard-artifacts
          merge-multiple: true

      - name: Seed _site with existing gh-pages content
        run: |
          mkdir -p _site
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git archive origin/gh-pages | tar -x -C _site
          fi

      - name: Build run page + rolling manifest
        run: node scripts/publish-dashboard.mjs

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
          keep_files: false
